# Local development PostgreSQL. Development credentials only - never reuse in production.
name: profit-intelligence
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profit_intelligence
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d profit_intelligence']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
